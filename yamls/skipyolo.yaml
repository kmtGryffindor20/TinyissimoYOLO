nc: 1

backbone:
  # Block 1 — unchanged (large spatial, skip would be expensive)
  - [-1, 1, Conv,         [16, 3, 1]]        # 0   3→16,  256×256
  - [-1, 1, nn.MaxPool2d, [2, 2, 0]]         # 1         128×128
  - [-1, 1, Conv,         [16, 3, 1]]        # 2
  - [-1, 1, Conv,         [16, 3, 1]]        # 3
  - [-1, 1, nn.MaxPool2d, [2, 2, 0]]         # 4          64×64

  # Block 2 — unchanged
  - [-1, 1, Conv,         [32, 3, 1]]        # 5
  - [-1, 1, Conv,         [32, 3, 1]]        # 6
  - [-1, 1, nn.MaxPool2d, [2, 2, 0]]         # 7          32×32

  # Block 3 — unchanged
  - [-1, 1, Conv,         [64, 3, 1]]        # 8
  - [-1, 1, Conv,         [64, 3, 1]]        # 9
  - [-1, 1, nn.MaxPool2d, [2, 2, 0]]         # 10         16×16

  # Block 4 — add residual skip
  # 64→64 identity skip: layer 10 output → Add after two convs
  - [-1, 1, Conv,         [64, 3, 1]]        # 11
  - [-1, 1, Conv,         [64, 3, 1]]        # 12
  - [[12, 10], 1, Add,    []]                # 13  skip from layer 10
  - [-1, 1, nn.MaxPool2d, [2, 2, 0]]         # 14          8×8

  # Block 5 — add residual skip
  # 128→128: need a projection on the skip path (64→128)
  - [-1, 1, DSConv,         [128, 3, 1]]       # 15
  - [-1, 1, DSConv,         [128, 3, 1]]       # 16
  - [14,  1, DSConv,        [128, 1, 1]]       # 17  projection: 64→128, from layer 14
  - [[16, 17], 1, Add,    []]                # 18  residual add

head:
  - [-1, 1, Conv,   [24, 1, 1]]              # 19  neck
  - [[-1], 1, Detect, [nc]]              # 20